version: '3.8'

services:
  db:
    image: postgres:16
    container_name: compose_db
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: compose_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:dev@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
